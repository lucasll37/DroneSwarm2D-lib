[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "DroneSwarm2D"
version = "0.1.0"
description = "2-D simulator for studying distributed defensive tactics with autonomous drone swarms"
readme = "README.md"
authors = [
    {name = "Lucas", email = "lucas.silva1037@gmail.com"}
]
license = {text = "MIT"}
requires-python = ">=3.12"
keywords = ["drone", "swarm", "simulation", "multi-agent", "distributed-systems", "pygame"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
]

# Only what the library imports. The analysis stack used in the research
# notebooks is available through the "analysis" extra (pinned in requirements.txt).
dependencies = [
    "CairoSVG>=2.7,<3",
    "imageio[ffmpeg]>=2.31,<3",
    "matplotlib>=3.8,<4",
    "numpy>=1.26,<3",
    "pygame>=2.5,<3",
]

[project.optional-dependencies]
analysis = [
    "ipykernel>=6",
    "opencv-python>=4.8",
    "pandas>=2.0",
    "Pillow>=10",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "seaborn>=0.13",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[project.scripts]
droneswarm2d = "DroneSwarm2D.cli:main"

[project.urls]
"Homepage" = "https://github.com/lucasll37/DroneSwarm2D-lib"
"Documentation" = "https://github.com/lucasll37/DroneSwarm2D-lib/tree/main/docs"
"Bug Tracker" = "https://github.com/lucasll37/DroneSwarm2D-lib/issues"
"Changelog" = "https://github.com/lucasll37/DroneSwarm2D-lib/blob/main/CHANGELOG.md"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["DroneSwarm2D*"]
exclude = ["app*", "images*", "tests*", "benchmarks*"]

[tool.setuptools.package-data]
DroneSwarm2D = [
    "assets/**/*",
    "assets/*.*",
    "templates/**/*",
    "templates/*.*"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    # Third-party noise (pyparsing deprecations triggered inside matplotlib).
    "ignore::DeprecationWarning:matplotlib.*",
]

[tool.coverage.run]
source = ["DroneSwarm2D"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]
ignore = [
    "UP006", "UP035",  # keep typing.List/Dict/Tuple for readability of existing signatures
    "UP045", "UP007",  # keep Optional[...] / Union[...]
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
"DroneSwarm2D/core/settings.py" = ["E402"]
